# Continuous Integration Workflow
#
# Validates code quality and correctness on every pull request and push to
# main.
#
# The test job runs the test suite across multiple Go versions (stable and
# oldstable) with race detection enabled to catch concurrency issues.
# The toolkit and adopting-organization example are separate Go modules.
#
# The lint job performs automated code quality checks using golangci-lint to
# catch common issues and style violations.
#
# The govulncheck job scans dependencies for known vulnerabilities and uploads
# results as SARIF to GitHub Code Scanning.

name: "🚦 Integration"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Testing (${{ matrix.module }}, ${{ matrix.go-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
        module: [., examples/acme]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race ./...

  lint:
    name: "🌡️ Linting (${{ matrix.module }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [., examples/acme]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  govulncheck:
    name: "🛡️ Vulnerability Scanning (${{ matrix.module }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [., examples/acme]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          work-dir: ${{ matrix.module }}
          output-format: sarif
          output-file: results.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: govulncheck-${{ matrix.module }}
