apiVersion: v1
kind: ConfigMap
metadata:
  name: detection-syslog-exporter-cm
  labels:
    app: detection-syslog-exporter
    solution: anomaly
data:
  detectionSyslogExporter: "true"
  health: ":3000"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    extern.siemServer = 127.0.0.1:5514
    driver.kafka.brokers = localhost:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-syslog-exporter
  labels:
    app: detection-syslog-exporter
    solution: anomaly
  annotations:
    solution.metadata/chart: "detection-syslog-exporter"
    solution.metadata/component: "detection-syslog-exporter"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection-syslog-exporter
  template:
    metadata:
      labels:
        app: detection-syslog-exporter
        solution: anomaly
      annotations:
        checksum/config: de401c40f096e66cabdfadfd85e066c7b28e1824490ad7ee9293702d289d5d3f
    spec:
      containers:
        - name: detection-syslog-exporter
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
          env:
            - name: DETECTIONSYSLOGEXPORTER
              valueFrom:
                configMapKeyRef:
                  name: detection-syslog-exporter-cm
                  key: detectionSyslogExporter
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: detection-syslog-exporter-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "300m"
              memory: "250Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: detection-syslog-exporter-cm
            items:
              - key: site.conf
                path: site.conf
