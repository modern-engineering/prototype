apiVersion: v1
kind: ConfigMap
metadata:
  name: digitaltwin-cm
  labels:
    app: digitaltwin
    solution: anomaly
data:
  # The enable key: the pod's env selects exactly this instance out of
  # the shared host image (tri-state enable semantics).
  digitaltwin: "true"
  health: ":3000"
  # The site fragment this instance's bindings reach; the host reads
  # it at startup (args[0]) and enforces the extern gate again.
  site.conf: |
    extern.kafkaCluster = localhost:9092
    driver.kafka.brokers = localhost:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitaltwin
  labels:
    app: digitaltwin
    solution: anomaly
  annotations:
    solution.metadata/chart: "digital-twin-translator"
    solution.metadata/component: "digitaltwin"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digitaltwin
  template:
    metadata:
      labels:
        app: digitaltwin
        solution: anomaly
      annotations:
        checksum/config: 0017829d1da7ef74e27ef669a9b98d44f0f7fc029bb6b6edb303ec790b280136
    spec:
      containers:
        - name: digitaltwin
          # One host image serves every instance of the solution; the
          # deployment pipeline substitutes the token.
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
          env:
            - name: DIGITALTWIN
              valueFrom:
                configMapKeyRef:
                  name: digitaltwin-cm
                  key: digitaltwin
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: digitaltwin-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: "250Mi"
            limits:
              cpu: "1"
              memory: "250Mi"
          volumeMounts:
            - name: site-config
              mountPath: /etc/solution/config
              readOnly: true
      volumes:
        - name: site-config
          configMap:
            name: digitaltwin-cm
            items:
              - key: site.conf
                path: site.conf
