apiVersion: v1
kind: ConfigMap
metadata:
  name: digitaltwin-cm
  labels:
    app: digitaltwin
    solution: anomaly
data:
  digitaltwin: "true"
  health: ":3000"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    driver.kafka.brokers = localhost:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitaltwin
  labels:
    app: digitaltwin
    solution: anomaly
  annotations:
    solution.metadata/chart: "digital-twin-translator"
    solution.metadata/component: "digitaltwin"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digitaltwin
  template:
    metadata:
      labels:
        app: digitaltwin
        solution: anomaly
      annotations:
        checksum/config: 2c255d82cf41ee0dc284a94ed7ea2a6b6a84c39c265029d5fadc5cee85e75361
    spec:
      containers:
        - name: digitaltwin
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
          env:
            - name: DIGITALTWIN
              valueFrom:
                configMapKeyRef:
                  name: digitaltwin-cm
                  key: digitaltwin
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: digitaltwin-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: "250Mi"
            limits:
              cpu: "1"
              memory: "250Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: digitaltwin-cm
            items:
              - key: site.conf
                path: site.conf
