apiVersion: v1
kind: ConfigMap
metadata:
  name: detection-alerts-journal-cm
  labels:
    app: detection-alerts-journal
    solution: anomaly
data:
  detectionAlertsJournal: "true"
  health: ":3000"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    extern.postgresServer = localhost:5432
    driver.kafka.brokers = localhost:9092
    driver.alertsDB.address = 127.0.0.1:5432
    driver.alertsDB.database = postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: detection-alerts-journal-secret
  labels:
    app: detection-alerts-journal
    solution: anomaly
type: Opaque
# The sensitive custody: tainted values mount from here, never from a
# ConfigMap and never through the environment.
stringData:
  secret.conf: |
    driver.alertsDB.password = dev-alerts-pass
    driver.alertsDB.username = postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-alerts-journal
  labels:
    app: detection-alerts-journal
    solution: anomaly
  annotations:
    solution.metadata/chart: "detection-alerts-journal"
    solution.metadata/component: "detection-alerts-journal"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection-alerts-journal
  template:
    metadata:
      labels:
        app: detection-alerts-journal
        solution: anomaly
      annotations:
        checksum/config: 2760a249c10e909f9769ed62b26cababcd61ad318557637daffc13a6ac950222
    spec:
      containers:
        - name: detection-alerts-journal
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
            - /etc/solution/secret/secret.conf
          env:
            - name: DETECTIONALERTSJOURNAL
              valueFrom:
                configMapKeyRef:
                  name: detection-alerts-journal-cm
                  key: detectionAlertsJournal
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: detection-alerts-journal-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "300m"
              memory: "250Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
            - name: solution-secret
              mountPath: /etc/solution/secret
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: detection-alerts-journal-cm
            items:
              - key: site.conf
                path: site.conf
        - name: solution-secret
          secret:
            secretName: detection-alerts-journal-secret
