apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-anomaly-detector-cm
  labels:
    app: identity-anomaly-detector
    solution: anomaly
data:
  # The enable key: the pod's env selects exactly this instance out of
  # the shared host image (tri-state enable semantics).
  identityAnomalyDetector: "true"
  health: ":3000"
  # The site fragment this instance's bindings reach; the host reads
  # it at startup (args[0]) and enforces the extern gate again.
  site.conf: |
    extern.kafkaCluster = localhost:9092
    extern.redisServer = localhost:6379
    driver.kafka.brokers = localhost:9092
    driver.identityState.address = 127.0.0.1:6379
    driver.identityState.db = 1
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-anomaly-detector-secret
  labels:
    app: identity-anomaly-detector
    solution: anomaly
type: Opaque
stringData:
  # The sensitive half of the site: extern Secrets and tainted driver
  # outputs, mounted as a second site file (path-in-args), never in a
  # ConfigMap and never in env.
  secret.conf: |
    driver.identityState.password = dev-anomaly-pass
    driver.identityState.username = dev-anomaly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-anomaly-detector
  labels:
    app: identity-anomaly-detector
    solution: anomaly
  annotations:
    solution.metadata/chart: "identity-anomaly-detector"
    solution.metadata/component: "identity-anomaly-detector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-anomaly-detector
  template:
    metadata:
      labels:
        app: identity-anomaly-detector
        solution: anomaly
      annotations:
        checksum/config: 109b7c6f72013fdcdf8245fe59f2f9581f12764e397378f858918f02cfa115ed
    spec:
      containers:
        - name: identity-anomaly-detector
          # One host image serves every instance of the solution; the
          # deployment pipeline substitutes the token.
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
            - /etc/solution/secret/secret.conf
          env:
            - name: IDENTITYANOMALYDETECTOR
              valueFrom:
                configMapKeyRef:
                  name: identity-anomaly-detector-cm
                  key: identityAnomalyDetector
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: identity-anomaly-detector-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "300m"
              memory: "250Mi"
          volumeMounts:
            - name: site-config
              mountPath: /etc/solution/config
              readOnly: true
            - name: site-secret
              mountPath: /etc/solution/secret
              readOnly: true
      volumes:
        - name: site-config
          configMap:
            name: identity-anomaly-detector-cm
            items:
              - key: site.conf
                path: site.conf
        - name: site-secret
          secret:
            secretName: identity-anomaly-detector-secret
