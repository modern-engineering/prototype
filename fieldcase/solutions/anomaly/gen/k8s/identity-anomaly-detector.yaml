apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-anomaly-detector-cm
  labels:
    app: identity-anomaly-detector
    solution: anomaly
data:
  health: ":3000"
  identityAnomalyDetector: "true"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    extern.redisServer = localhost:6379
    driver.kafka.brokers = localhost:9092
    driver.identityState.address = 127.0.0.1:6379
    driver.identityState.db = 1
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-anomaly-detector-secret
  labels:
    app: identity-anomaly-detector
    solution: anomaly
type: Opaque
# The sensitive custody: tainted values mount from here, never from a
# ConfigMap and never through the environment.
stringData:
  secret.conf: |
    driver.identityState.password = dev-anomaly-pass
    driver.identityState.username = dev-anomaly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-anomaly-detector
  labels:
    app: identity-anomaly-detector
    solution: anomaly
  annotations:
    solution.metadata/chart: "identity-anomaly-detector"
    solution.metadata/component: "identity-anomaly-detector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-anomaly-detector
  template:
    metadata:
      labels:
        app: identity-anomaly-detector
        solution: anomaly
      annotations:
        checksum/config: ea085a24edb621d2b2b2eaef175c73078a7698ce27309e4810ceda10f90b486f
    spec:
      containers:
        - name: identity-anomaly-detector
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
            - /etc/solution/secret/secret.conf
          env:
            - name: IDENTITYANOMALYDETECTOR
              valueFrom:
                configMapKeyRef:
                  name: identity-anomaly-detector-cm
                  key: identityAnomalyDetector
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: identity-anomaly-detector-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "300m"
              memory: "250Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
            - name: solution-secret
              mountPath: /etc/solution/secret
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: identity-anomaly-detector-cm
            items:
              - key: site.conf
                path: site.conf
        - name: solution-secret
          secret:
            secretName: identity-anomaly-detector-secret
