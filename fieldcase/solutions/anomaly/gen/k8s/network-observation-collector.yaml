apiVersion: v1
kind: ConfigMap
metadata:
  name: network-observation-collector-cm
  labels:
    app: network-observation-collector
    solution: anomaly
data:
  health: ":3000"
  networkObservationCollector: "true"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    var.networkController = http://127.0.0.1:8081/api
    extern.redisServer = localhost:6379
    driver.kafka.brokers = localhost:9092
    driver.controllerTokenCache.db = 0
    driver.controllerTokenCache.host = 127.0.0.1
    driver.controllerTokenCache.port = 6379
---
apiVersion: v1
kind: Secret
metadata:
  name: network-observation-collector-secret
  labels:
    app: network-observation-collector
    solution: anomaly
type: Opaque
# The sensitive custody: tainted values mount from here, never from a
# ConfigMap and never through the environment.
stringData:
  secret.conf: |
    extern.organizationID = 0abcdef0-dev0-4000-8000-devorg000000
    extern.tenantID = 0abcdef0-dev0-4000-8000-devaccount00
    driver.controllerTokenCache.password = dev-token-cache-pass
    driver.controllerTokenCache.username = dev-token-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-observation-collector
  labels:
    app: network-observation-collector
    solution: anomaly
  annotations:
    solution.metadata/chart: "network-observation-collector"
    solution.metadata/component: "network-observation-collector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-observation-collector
  template:
    metadata:
      labels:
        app: network-observation-collector
        solution: anomaly
      annotations:
        checksum/config: e24394b751bbcbc5521e092d602c377f10fcc455524786cfcb20994050fb8247
    spec:
      containers:
        - name: network-observation-collector
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
            - /etc/solution/secret/secret.conf
          env:
            - name: NETWORKOBSERVATIONCOLLECTOR
              valueFrom:
                configMapKeyRef:
                  name: network-observation-collector-cm
                  key: networkObservationCollector
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: network-observation-collector-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "150m"
              memory: "100Mi"
            limits:
              cpu: "150m"
              memory: "100Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
            - name: solution-secret
              mountPath: /etc/solution/secret
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: network-observation-collector-cm
            items:
              - key: site.conf
                path: site.conf
        - name: solution-secret
          secret:
            secretName: network-observation-collector-secret
