apiVersion: v1
kind: ConfigMap
metadata:
  name: digital-twin-graph-cm
  labels:
    app: digital-twin-graph
    solution: anomaly
data:
  digitalTwinGraph: "true"
  health: ":3000"
  site.conf: |
    extern.kafkaCluster = localhost:9092
    extern.neo4jServer = bolt://localhost:7687
    driver.kafka.brokers = localhost:9092
    driver.twinDB.uri = bolt://127.0.0.1:7687
---
apiVersion: v1
kind: Secret
metadata:
  name: digital-twin-graph-secret
  labels:
    app: digital-twin-graph
    solution: anomaly
type: Opaque
# The sensitive custody: tainted values mount from here, never from a
# ConfigMap and never through the environment.
stringData:
  secret.conf: |
    driver.twinDB.password = dev-twin-pass
    driver.twinDB.username = neo4j
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin-graph
  labels:
    app: digital-twin-graph
    solution: anomaly
  annotations:
    solution.metadata/chart: "digital-twin"
    solution.metadata/component: "digital-twin-graph"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digital-twin-graph
  template:
    metadata:
      labels:
        app: digital-twin-graph
        solution: anomaly
      annotations:
        checksum/config: 37dbda8bcadc9fe0d0e245649bc3103cf406495e4fada718241773c90c80c280
    spec:
      containers:
        - name: digital-twin-graph
          image: ${ANOMALY_HOST_IMAGE}
          args:
            - /etc/solution/config/site.conf
            - /etc/solution/secret/secret.conf
          env:
            - name: DIGITALTWINGRAPH
              valueFrom:
                configMapKeyRef:
                  name: digital-twin-graph-cm
                  key: digitalTwinGraph
            - name: HEALTH
              valueFrom:
                configMapKeyRef:
                  name: digital-twin-graph-cm
                  key: health
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: "250Mi"
            limits:
              cpu: "1"
              memory: "250Mi"
          volumeMounts:
            - name: solution-config
              mountPath: /etc/solution/config
              readOnly: true
            - name: solution-secret
              mountPath: /etc/solution/secret
              readOnly: true
      volumes:
        - name: solution-config
          configMap:
            name: digital-twin-graph-cm
            items:
              - key: site.conf
                path: site.conf
        - name: solution-secret
          secret:
            secretName: digital-twin-graph-secret
